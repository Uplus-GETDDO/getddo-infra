# Install ONLY on the dedicated monitoring host, never on API A/C.
# Docker restart policies cannot bypass verified EBS and volatile-secret preparation.
[Unit]
RequiresMountsFor=/srv/monitoring
After=network-online.target
Wants=network-online.target

[Service]
ExecStartPre=/opt/getddo-monitoring/scripts/monitoring-host.sh guard
ExecStartPre=/opt/getddo-monitoring/scripts/monitoring-host.sh secret
