apiVersion: 1
providers:
  - name: Prod
    orgId: 1
    folder: Prod
    type: file
    disableDeletion: true
    editable: false
    options: {path: /etc/grafana/dashboards}
  - name: Staging
    orgId: 1
    folder: Staging
    type: file
    disableDeletion: true
    editable: false
    options: {path: /etc/grafana/staging-dashboards}
