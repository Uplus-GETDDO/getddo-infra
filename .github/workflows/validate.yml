name: Validate infrastructure
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  terraform:
    name: Terraform 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - run: python3 scripts/validate.py terraform
  scripts_config:
    name: 스크립트·설정 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install PyYAML==6.0.3 boto3==1.40.59 Werkzeug==3.1.3
      - run: python3 scripts/validate.py scripts
      - run: bash scripts/install-monitoring-check-tools.sh "$RUNNER_TEMP/monitoring-tools"
      - run: python3 scripts/check-monitoring.py
        env:
          PROMTOOL_BIN: ${{ runner.temp }}/monitoring-tools/promtool
          COMPOSE_BIN: ${{ runner.temp }}/monitoring-tools/docker-compose
